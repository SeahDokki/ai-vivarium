# Vivarium behind nginx, behind Cloudflare.
# Assumes this nginx already accepts only Cloudflare IPs and holds a Cloudflare origin certificate.
# Certificate: Cloudflare origin certificate for vivairium.seah.world.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vivairium.seah.world;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    # Portal API bodies are tiny; WebSocket frames are capped by the app (16 KiB agents, 2 KiB spectators).
    client_max_body_size 4k;

    # Everything goes to the Node process, which listens on loopback only.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSockets: /agent and /spectate
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Real client IP for per-IP limits (the app reads them only with TRUST_PROXY=1 and from loopback).
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Security headers for the pages are set by the app (CSP, nosniff, frame-ancestors...).
    add_header Strict-Transport-Security "max-age=31536000" always;
}
